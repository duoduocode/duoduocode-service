server:
  port: 8080
  # 导入文件上传上限（base64 膨胀 1.33x，前端限源文件 5MB）
  tomcat:
    max-http-form-post-size: 10MB

spring:
  application:
    name: duoduocode-service
  profiles:
    default: local   # 缺省本地开发；ECS 由 systemd env 的 SPRING_PROFILES_ACTIVE 指定 test/prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 30000
      validation-timeout: 10000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.duoduocode.service.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT 配置（secret 外置：生产环境必须通过环境变量注入，默认值仅供本地开发）
jwt:
  secret: ${JWT_SECRET:duoduocode-local-dev-jwt-secret-key-min-256-bits}
  access-token-expiration: 7200
  refresh-token-expiration: 604800
  expiration: 86400000

# 微信小程序配置（secret 不入库：本地经环境变量提供，dev-login 不依赖它）
wechat:
  mini:
    appid: ${WX_APPID:wxd28c90174393e686}
    secret: ${WX_SECRET:}

# 应用配置（R002 消息中心 / R004 月报）
app:
  notification:
    scan-cron: "0 30 8 * * ?"            # 每日扫描时点
    cleanup-cron: "0 40 8 * * ?"          # 扫描后清理
    budget-warn-threshold: 80             # 预算预警阈值（%）
    budget-exceed-threshold: 100          # 预算超限阈值（%）
    repayment-advance-days: 2             # 还款日提前提醒天数
    notice-retention-days: 90             # 已读通知保留天数
    todo-retention-days: 30               # 已消化待办保留天数
  wechat:
    subscribe:
      enabled: false                      # 微信订阅消息外发（后置：模板 ID 到位后启用）
  report:
    monthly-cron: "0 0 5 1 * ?"           # 月报生成时点（每月 1 日 05:00，R004）
  test:
    scan-endpoint:
      enabled: false                      # 安全默认：仅 local/test profile 显式开启

logging:
  level:
    com.duoduocode: debug
    org.springframework.web: info
