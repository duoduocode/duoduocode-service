name: backend-ci

# 后端 CI：单元测试(快层，默认) + 接口测试与四维覆盖率门禁(全层，开关启用)
# 分支模型（三级流水线）：feature/R00X-* → test（测试环境）→ main（生产环境）
# 接口测试的数据源为工作区元仓（含 test/ 自动化工程），
# 在本仓库 Settings > Secrets and variables > Actions 添加:
#   secrets: TEST_REPO_TOKEN        # 可访问元仓的 PAT
#   vars:   ENABLE_API_TESTS=true   # 接口测试开关（合并 test/main 时建议开启）
#           TEST_REPO=<user>/duoduocode-workspace
#           DB_PASSWORD             # CI MySQL root 密码（或用默认 duoduo123）

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

jobs:
  # ─────────── Job 1: 编译 + 单元测试（默认启用） ───────────
  unit-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: duoduo123
          MYSQL_DATABASE: duoduocode_dev
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/duoduocode_dev?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: duoduo123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 导入数据库 schema（16 表 + 种子数据）
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -uroot -pduoduo123 duoduocode_dev < src/main/resources/schema.sql

      - name: 单元测试（mvn test）
        run: mvn -B test

      - name: 上传 JaCoCo 报告与 exec（供门禁合并）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-jacoco
          path: |
            target/jacoco.exec
            target/site/jacoco/
          retention-days: 14

  # ─────────── Job 2: 接口测试 + 四维覆盖率门禁（开关启用） ───────────
  api-tests-gate:
    if: vars.ENABLE_API_TESTS == 'true'
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: duoduo123
          MYSQL_DATABASE: duoduocode_dev
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/duoduocode_dev?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: duoduo123
      DB_PASSWORD: duoduo123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 拉取接口测试仓库（test/）
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TEST_REPO }}
          token: ${{ secrets.TEST_REPO_TOKEN }}
          path: test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r test/requirements.txt

      - name: 导入 schema 并打包后端
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -uroot -pduoduo123 duoduocode_dev < src/main/resources/schema.sql
          mvn -B package -DskipTests

      - name: 下载 JaCoCo 工具（agent + cli）
        run: |
          curl -sL -o jacoco.zip https://repo1.maven.org/maven2/org/jacoco/jacoco/0.8.12/jacoco-0.8.12.zip
          unzip -q jacoco.zip -d jacoco
          mkdir -p test/tools/jacoco
          cp jacoco/lib/jacocoagent.jar jacoco/lib/jacococli.jar test/tools/jacoco/

      - name: 以 JaCoCo agent 启动后端
        run: |
          java -javaagent:test/tools/jacoco/jacocoagent.jar=output=tcpserver,address=127.0.0.1,port=6300 \
               -jar target/*.jar &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/v3/api-docs > /dev/null && echo "服务就绪" && exit 0
            sleep 2
          done
          echo "后端 120s 内未就绪" && exit 1

      - name: 指向 CI 数据库（改写 test/config/settings.yml 的 db 段）
        run: |
          python - <<'EOF'
          import re
          p = "test/config/settings.yml"
          s = open(p, encoding="utf-8").read()
          s = s.replace("host: rm-bp1m5pf44nzonuabqfo.mysql.rds.aliyuncs.com", "host: 127.0.0.1")
          s = re.sub(r"user: \S+", "user: root", s)
          s = re.sub(r"password: \"[^\"]*\"", 'password: "duoduo123"', s)
          open(p, "w", encoding="utf-8").write(s)
          print("settings.yml 已指向 CI MySQL")
          EOF

      - name: 接口测试（pytest）
        working-directory: test
        run: pytest testcases -q

      - name: 四维覆盖率门禁（合并单测+接口 exec）
        working-directory: test
        run: |
          python scripts/coverage_gate.py \
              --exec "../target/jacoco.exec" "reports/coverage/jacoco.exec" \
              --classfiles "../target/classes" --sourcefiles "../src/main/java"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            test/reports/
          retention-days: 14
